<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Widget Demo — CSD &amp; CSIT Cricket League 2026</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 40px 20px;
      font-family: system-ui, sans-serif;
    }
    h2 {
      color: #fff;
      margin: 0 0 4px;
      font-size: 18px;
      text-align: center;
    }
    p {
      color: rgba(255,255,255,.75);
      margin: 0 0 16px;
      font-size: 13px;
      text-align: center;
    }
    .embed-code {
      background: #1e293b;
      color: #7dd3fc;
      padding: 14px 18px;
      border-radius: 10px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      max-width: 560px;
      width: 100%;
      overflow-x: auto;
      white-space: pre;
    }
    #csd-cricket-widget { max-width: 560px; width: 100%; }
  </style>
</head>
<body>

  <h2>🏏 Points Table Widget — Live Demo</h2>
  <p>This is how the widget looks when embedded on any external website.</p>

  <!-- ① The container (just one div) -->
  <div id="csd-cricket-widget"></div>

  <p style="margin-top:8px">Copy the two lines below and paste on any website:</p>
  <div class="embed-code">&lt;div id="csd-cricket-widget"&gt;&lt;/div&gt;

&lt;script
  src="https://YOUR-DOMAIN/widget.js"&gt;
&lt;/script&gt;</div>

  <!-- Optional: override config BEFORE loading widget.js -->
  <script>
    window.CSDWidgetConfig = {
      containerId:   "csd-cricket-widget",
      defaultLeague: "sr",
      /* linkToSite: "https://your-domain.com/points-table.html" */
    };
  </script>

  <!-- ② Load the widget script -->
  <script src="widget.js"></script>

</body>
</html>
