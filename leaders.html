<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaders — CSD &amp; CSIT Tournament</title>
  <meta name="description" content="Top run scorers and wicket takers in the CSD &amp; CSIT Cricket Tournament 2026." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo-area" aria-label="Home">
      <img src="asserts/hpl_Logo.png" alt="HPL 2026" class="nav-hpl-logo" />
      <div class="logo-text">
        <div class="logo-title">CSD &amp; CSIT</div>
        <div class="logo-sub">Cricket Tournament</div>
      </div>
    </a>
    <button class="hamburger" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav-menu">
      <span class="bar1"></span><span class="bar2"></span><span class="bar3"></span>
    </button>
    <ul class="nav-menu" id="nav-menu" role="list">
      <li><a href="index.html" class="nav-link">🏠 Home</a></li>
      <li><a href="matches.html" class="nav-link">Matches</a></li>
      <li><a href="points-table.html" class="nav-link">🏆 Points Table</a></li>
      <li><a href="leaders.html" class="nav-link active">🏅 Leaders</a></li>
      <li><a href="scorer.html" class="nav-link nav-scorer">Scorer Portal</a></li>
      <li><a href="admin.html" class="nav-link nav-admin">🔒 Admin</a></li>
    </ul>
  </div>
</header>

<div class="page-banner">
  <div class="container">
    <h1>🏅 Tournament Leaders</h1>
    <p>Top performers across all matches</p>
  </div>
</div>

<div class="container page-body">
  <div class="leaders-grid">

    <!-- Run Scorers -->
    <div class="card">
      <div class="card-header"><span class="card-title">🏏 Top Run Scorers</span></div>
      <div class="table-scroll">
        <table class="leader-table" aria-label="Top run scorers">
          <thead>
            <tr>
              <th>#</th><th>Player</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th><th>HS</th>
            </tr>
          </thead>
          <tbody id="runs-body"></tbody>
        </table>
      </div>
    </div>

    <!-- Wicket Takers -->
    <div class="card">
      <div class="card-header"><span class="card-title">🎯 Top Wicket Takers</span></div>
      <div class="table-scroll">
        <table class="leader-table" aria-label="Top wicket takers">
          <thead>
            <tr>
              <th>#</th><th>Player</th><th>Wkts</th><th>Ov</th><th>Runs</th><th>Eco</th><th>Best</th>
            </tr>
          </thead>
          <tbody id="wkts-body"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const rankClass = i => ["gold","silver","bronze"][i] || "";

  // Run scorers
  const rb = document.getElementById("runs-body");
  DEFAULT_RUN_SCORERS.forEach((p, i) => {
    rb.innerHTML += `<tr>
      <td><span class="rank-badge ${rankClass(i)}">${p.rank}</span></td>
      <td><div class="leader-name">${p.name}</div><div class="leader-team">${p.team}</div></td>
      <td class="leader-stat">${p.runs}</td>
      <td style="color:var(--text-muted)">${p.balls}</td>
      <td>${p.fours}</td><td>${p.sixes}</td>
      <td style="font-weight:600">${p.sr}</td>
      <td style="color:var(--green);font-weight:600">${p.hs}</td>
    </tr>`;
  });

  // Wicket takers
  const wb = document.getElementById("wkts-body");
  DEFAULT_WICKET_TAKERS.forEach((p, i) => {
    wb.innerHTML += `<tr>
      <td><span class="rank-badge ${rankClass(i)}">${p.rank}</span></td>
      <td><div class="leader-name">${p.name}</div><div class="leader-team">${p.team}</div></td>
      <td class="leader-stat">${p.wickets}</td>
      <td style="color:var(--text-muted)">${p.overs}</td>
      <td>${p.runs}</td>
      <td style="font-weight:600">${p.economy}</td>
      <td style="color:var(--blue);font-weight:600">${p.best}</td>
    </tr>`;
  });
});
</script>
</body>
</html>
